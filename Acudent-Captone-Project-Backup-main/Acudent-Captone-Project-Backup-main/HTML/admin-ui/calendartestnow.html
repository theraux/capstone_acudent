<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Calendar Example</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f8f6f2;
    color: #333;
    margin: 0;
    padding: 2rem;
  }

  h2 {
    margin-bottom: 1rem;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    max-width: 500px;
    margin-top: 1rem;
  }

  .day {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
  }

  .day:hover {
    background: #f0f0f0;
  }

  .day.booked {
    background: #fdd;
    border-color: #f88;
  }

  .day.blocked {
    background: #d3d3d3;
    color: #666;
  }

  .edit-mode .day {
    cursor: pointer;
  }

  /* Modal styling */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    padding: 1.5rem;
    border-radius: 10px;
    width: 300px;
  }

  .modal-content label {
    display: block;
    margin: 0.5rem 0 0.2rem;
  }

  .modal-content input[type="time"],
  .modal-content button {
    width: 100%;
    padding: 0.5rem;
    margin-bottom: 1rem;
  }

  .buttons {
    margin-bottom: 1rem;
  }

  .buttons button {
    margin-right: 10px;
    padding: 0.5rem 1rem;
    border: none;
    background: #704e2e;
    color: white;
    border-radius: 5px;
    cursor: pointer;
  }

  .buttons button.edit {
    background: #a37447;
  }

</style>
</head>
<body>

<h2>Admin Calendar</h2>

<div class="buttons">
  <button id="viewBtn">View Mode</button>
  <button id="editBtn" class="edit">Edit Mode</button>
</div>

<div id="calendar" class="calendar"></div>

<!-- Modal for blocking time -->
<div id="blockModal" class="modal">
  <div class="modal-content">
    <h3>Block Time for <span id="modal-date"></span></h3>

    <label>
      <input type="checkbox" id="full-day"> Close whole day
    </label>

    <label>Start time:</label>
    <input type="time" id="start-time">

    <label>End time:</label>
    <input type="time" id="end-time">

    <button id="confirmBlock">Confirm</button>
    <button id="cancelBlock">Cancel</button>
  </div>
</div>

<script>
  const calendar = document.getElementById('calendar');
  const blockModal = document.getElementById('blockModal');
  const modalDate = document.getElementById('modal-date');
  const startInput = document.getElementById('start-time');
  const endInput = document.getElementById('end-time');
  const fullDayCheckbox = document.getElementById('full-day');

  let adminMode = 'view';
  let blockedDays = {};
  let bookedDays = { '2025-10-14': ['09:00 - 10:00'], '2025-10-17': ['13:00 - 15:00'] };

  // Create sample calendar (14 days)
  const today = new Date();
  for (let i = 0; i < 14; i++) {
    const date = new Date(today);
    date.setDate(today.getDate() + i);
    const iso = date.toISOString().split('T')[0];
    const div = document.createElement('div');
    div.classList.add('day');
    div.dataset.date = iso;
    div.textContent = date.getDate();

    // mark booked days
    if (bookedDays[iso]) div.classList.add('booked');
    calendar.appendChild(div);
  }

  // Toggle modes
  document.getElementById('editBtn').addEventListener('click', () => {
    adminMode = 'edit';
    calendar.classList.add('edit-mode');
  });

  document.getElementById('viewBtn').addEventListener('click', () => {
    adminMode = 'view';
    calendar.classList.remove('edit-mode');
  });

  // Handle clicks
  calendar.addEventListener('click', (e) => {
    if (!e.target.classList.contains('day')) return;
    const date = e.target.dataset.date;

    if (adminMode === 'view') {
      showBookings(date);
    } else if (adminMode === 'edit') {
      openBlockModal(date);
    }
  });

  // Show booked appointments
  function showBookings(date) {
    if (bookedDays[date]) {
      alert(`Bookings for ${date}:\n${bookedDays[date].join(', ')}`);
    } else {
      alert(`No bookings on ${date}.`);
    }
  }

  // Open block modal
  function openBlockModal(date) {
    modalDate.textContent = date;
    startInput.value = '';
    endInput.value = '';
    fullDayCheckbox.checked = false;
    blockModal.style.display = 'flex';
  }

  // Confirm blocking
  document.getElementById('confirmBlock').addEventListener('click', () => {
    const date = modalDate.textContent;
    const start = startInput.value;
    const end = endInput.value;
    const fullDay = fullDayCheckbox.checked;

    if (fullDay) {
      blockedDays[date] = ['FULL DAY'];
    } else if (start && end) {
      blockedDays[date] = [`${start} - ${end}`];
    } else {
      alert('Please select full day or a valid time range.');
      return;
    }

    markBlockedDates();
    blockModal.style.display = 'none';
  });

  document.getElementById('cancelBlock').addEventListener('click', () => {
    blockModal.style.display = 'none';
  });

  function markBlockedDates() {
    document.querySelectorAll('.day').forEach(day => {
      const date = day.dataset.date;
      if (blockedDays[date]) {
        day.classList.add('blocked');
      }
    });
  }
</script>
</body>
</html>
