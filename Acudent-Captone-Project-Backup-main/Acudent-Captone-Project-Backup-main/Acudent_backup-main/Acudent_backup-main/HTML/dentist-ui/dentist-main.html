<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Add in the <head> of your HTML -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../../CSS/dentist-ui/dentist-sidebar.css">
    <link rel="stylesheet" href="../../CSS/dentist-ui/dentist-navbar.css">
    <title>Document</title>
</head>

<body>

    <!--Navigation bar-->
    <nav class="Navbar fixed-top">
        <div class="top-nav">
            <div class="container-lg d-flex justify-content-between align-items-center">

                <!-- Left: Logo -->
                <div class="mapru-logo">
                    <img src="../../Pictures/user-interface/banners-images-logo/logo.png" alt="Logo">
                </div>

                <!-- Right: Clickable Icons with Badges -->
                <div class="d-flex align-items-center gap-4">

                    <!-- Message Icon -->
                    <a href="/messages" class="icon-wrapper position-relative" title="Messages">
                        <i class="fas fa-envelope"></i>
                        <span class="badge"></span>
                    </a>

                    <!-- Notification Icon -->
                    <a href="/notifications" class="icon-wrapper position-relative" title="Notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge"></span>
                    </a>

                    <!-- Profile Picture -->
                    <div class="nav-item">
                        <img id="admin-profile-pic" class="img-fluid rounded-circle" src="" alt="Profile Picture"
                            style="width: 40px; height: 40px; object-fit: cover;">
                        <h3 id="admin-display" class="ms-1" style="display: inline-block;">Dracy</h3>
                    </div>
                </div>
            </div>
        </div>
    </nav>



            <!-- Sidebar for md+ screens -->
            <div class="container-fluid">
                <div class="row d-flex">

                    <!-- Sidebar -->
                    <aside class="col-md-3 col-lg-2 d-none d-md-block p-4 sidebar mt-3">
                        <div class="text-center mb-4">
                            <img id="profile-pic" class="img-fluid rounded-circle mb-2" src="" alt="Profile Picture"
                                style="width: 100px; height: 100px; object-fit: cover; margin-top: 8rem;">
                            <h3 id="username-display" class="mt-4 mb-3">Dracy</h3>
                        </div>
                        <nav class="nav flex-column nav-buttons">
                            <button class="btn w-100 mt-2" tabindex="0" data-target="admin-dashboard">
                                <i class="fas fa-home"></i> Dashboard
                            </button>
                            <button class="btn w-100 mt-2" tabindex="0" data-target="admin-patient-profiles">
                                <i class="fas fa-user"></i> Appointment
                            </button>
                            <button class="btn w-100 mt-2" tabindex="0" data-target="admin-dentistprofile">
                                <i class="fas fa-user"></i> Patient
                            </button>
                            <button class="btn w-100 mt-2" tabindex="0" data-target="admin-inventory">
                                <i class="fas fa-box"></i> My Information
                            </button>
                            <button class="btn w-100 mt-3">Log out</button>
                        </nav>
                    </aside>

                    
                </div>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
