    <script>
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        let currentDate = new Date();
        const today = new Date(); // Fixed today for highlighting
        let showIndicators = true; // Initial state for view mode

        function renderCalendar() {
            let year = currentDate.getFullYear();
            let month = currentDate.getMonth();
            document.getElementById('month-year').innerText = months[month] + ' ' + year;

            let firstDayOfWeek = new Date(year, month, 1).getDay(); // 0 = Sunday
            let daysInMonth = new Date(year, month + 1, 0).getDate();
            let daysInPrevMonth = new Date(year, month, 0).getDate();
            let totalSlots = firstDayOfWeek + daysInMonth; // Slots needed for current + padding
            let numRows = Math.ceil(totalSlots / 7); // Dynamic rows (up to 6)

            let daysContainer = document.querySelector('.number-of-days');
            daysContainer.innerHTML = ''; // Clear previous content

            let nextDayCounter = 1; // For next month's days

            for (let row = 0; row < numRows; row++) {
                let rowDiv = document.createElement('div');
                rowDiv.className = 'row row-cols-7 g-0';

                for (let col = 0; col < 7; col++) {
                    let cellIndex = row * 7 + col;
                    let colDiv = document.createElement('div');
                    colDiv.className = 'col';

                    let box = document.createElement('div');
                    box.className = 'admin-calendar-box';

                    if (cellIndex < firstDayOfWeek) {
                        // Previous month's trailing days (grayed out)
                        let prevDay = daysInPrevMonth - (firstDayOfWeek - 1 - cellIndex);
                        box.textContent = prevDay;
                        box.classList.add('prev-month');
                    } else if (cellIndex < firstDayOfWeek + daysInMonth) {
                        // Current month's days (full opacity)
                        let day = cellIndex - firstDayOfWeek + 1;
                        box.dataset.day = day; // Set data attribute for reliable click parsing
                        let dateKey = formatDate(year, month, day);
                        const appts = patientAppointments[dateKey];

                        if (showIndicators && appts && appts.length > 0) {
                            // Show abbreviated overview in box: day + first appointment (time + service), +more if multiple
                            let overview = `${day}`;
                            const firstAppt = appts[0];
                            const startTime = firstAppt.time.split(' - ')[0]; // e.g., "09:00 AM"
                            overview += `<br><small style="color: #703803; font-size: 12px;">${startTime} ${firstAppt.service}</small>`;
                            if (appts.length > 1) {
                                overview += `<br><small style="color: #9E5B08; font-size: 0.75rem;">+${appts.length - 1} more</small>`;
                            }
                            box.innerHTML = overview;
                            box.classList.add('has-appointments', 'current-month');
                        } else {
                            box.textContent = day;
                            box.classList.add('current-month');
                        }

                        // Highlight today's date if it matches the current view
                        if (day === today.getDate() &&
                            month === today.getMonth() &&
                            year === today.getFullYear()) {
                            box.classList.add('today');
                        }
                    } else {
                        // Next month's leading days (grayed out, continuous numbering)
                        box.textContent = nextDayCounter;
                        box.classList.add('next-month');
                        nextDayCounter++;
                    }

                    colDiv.appendChild(box);
                    rowDiv.appendChild(colDiv);
                }

                daysContainer.appendChild(rowDiv);
            }
        }

        function formatDate(year, month, day) {
            const d = new Date(year, month, day);
            return d.toISOString().split("T")[0]; // YYYY-MM-DD
        }

        function prevmonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextmonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        // Initialize the calendar on load
        renderCalendar();
    </script>

        },

};

// Keeps track of what mode admin is in: 'view' or 'edit'
let adminMode = "view"; // Start automatically in view mode

// Global for raw dateKey (for details toggle)
let currentDateKey = '';

// --- Elements ---
const editBtn = document.getElementById("edit-schedule");
const editModal = document.getElementById("admin-edit-appointment-schedule");
const viewModal = document.getElementById("admin-view-appointments-modal");
const editModalDate = document.getElementById("admin-modal-date");
const viewModalDate = document.getElementById("view-modal-date");
const viewList = document.querySelector(".view-appointments-list");
const cancelBtn = document.getElementById("admin-cancel-appointment-btn");
const confirmBtn = document.getElementById("admin-confirm-appointment-btn");
const fullDayCheckbox = document.getElementById("admin-full-day");
const startTimeInput = document.getElementById("admin-start-time");
const endTimeInput = document.getElementById("admin-end-time");
const closeViewX = document.querySelector(".btn-close-view-appointments");
const closeEditX = document.querySelector(".btn-close-edit-appointment-schedule");

// New Elements for Single Modal Toggle (Update IDs to match your HTML)
const appointmentList = document.querySelector(".view-appointments-list") || document.getElementById('appointment-list');  // Your list
const detailsView = document.getElementById('details-view');
const backButtonContainer = document.getElementById('back-button-container');

// --- Edit Modal Event Listeners ---
if (closeEditX) {
    closeEditX.addEventListener("click", () => {
        editModal.classList.remove("active");
    });
}

window.addEventListener("click", (event) => {
    if (event.target === editModal) {
        editModal.classList.remove("active");
    }
});

// --- View Modal Event Listeners (Updated for Single Modal) ---
if (closeViewX) {
    closeViewX.addEventListener("click", closeViewModal);
}

window.addEventListener("click", (event) => {
    if (event.target === viewModal) {
        closeViewModal();
    }
});

// --- Back Button Event (New for Toggle) ---
function backToListView() {
    if (detailsView) {
        detailsView.style.display = 'none';
        if (appointmentList) appointmentList.style.display = 'block';
        // Clear placeholders
        const placeholders = ['patient-name-placeholder', 'detail-date', 'detail-time', 'detail-service', 'detail-dentist', 'detail-fee', 'detail-duration', 'detail-phone', 'detail-email', 'detail-notes'];
        placeholders.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = '';
        });
        // Remove back button
        if (backButtonContainer) backButtonContainer.innerHTML = '';
    }
}

// --- Close View Modal (Updated - Reset to List) ---
function closeViewModal() {
    viewModal.classList.remove("active");
    backToListView();
    if (viewList || appointmentList) (viewList || appointmentList).innerHTML = '';
    if (viewModalDate) viewModalDate.textContent = '';
    currentDateKey = '';
}

// --- Show Appointment Details (New - Toggle Inside View Modal) ---
function showAppointmentDetails(appointment, dateKey) {
    if (!appointment) {
        console.warn('No appointment data found');
        return;
    }

    const date = new Date(dateKey);
    const formattedDate = date.toLocaleDateString('en-US', { 
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
    });

    // Populate placeholders (assumes HTML has these IDs)
    const placeholders = {
        'patient-name-placeholder': appointment.name || 'N/A',
        'detail-date': formattedDate,
        'detail-time': appointment.time || 'N/A',
        'detail-service': appointment.service || 'N/A',
        'detail-dentist': appointment.dentist || 'Not assigned',
        'detail-fee': appointment.fee || 'N/A',
        'detail-duration': appointment.duration || 'N/A',
        'detail-phone': appointment.phone || 'N/A',
        'detail-email': appointment.email || 'N/A',
        'detail-notes': appointment.notes || 'No notes'
    };

    Object.keys(placeholders).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = placeholders[id];
    });

    // Add Back Button (if not already)
    if (backButtonContainer && !backButtonContainer.querySelector('#back-to-list')) {
        backButtonContainer.innerHTML = `
            <button id="back-to-list" class="btn btn-secondary" style="background: #8B5E34; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                ← Back to List
            </button>
        `;
        const backBtn = document.getElementById('back-to-list');
        if (backBtn) backBtn.addEventListener('click', backToListView);
    }

    // Toggle views
    if (appointmentList || viewList) (appointmentList || viewList).style.display = 'none';
    if (detailsView) detailsView.style.display = 'block';

    // Scroll to top
    if (viewModal) viewModal.scrollTop = 0;
}

// --- BUTTON ACTIONS (Edit button toggles modes) ---
if (editBtn) {
    editBtn.addEventListener("click", () => {
        if (adminMode === "view") {
            // Switch to edit mode
            adminMode = "edit";
            if (typeof showIndicators !== 'undefined') showIndicators = false;
            renderCalendar(); // Re-render to hide appointment indicators
            editBtn.textContent = "Done Editing"; // Indicate toggle state
        } else {
            // Switch back to view mode
            adminMode = "view";
            if (typeof showIndicators !== 'undefined') showIndicators = true;
            renderCalendar(); // Re-render to show appointment indicators/overview
            editBtn.textContent = "Edit";
        }
        // Modal opens only on date click in edit mode
    });
}

// Confirm blocking (edit mode)
if (confirmBtn) {
    confirmBtn.addEventListener("click", () => {
        const selectedDate = editModalDate ? editModalDate.textContent : '';
        const start = startTimeInput ? startTimeInput.value : '';
        const end = endTimeInput ? endTimeInput.value : '';
        const fullDay = fullDayCheckbox ? fullDayCheckbox.checked : false;

        if (fullDay) {
            alert(`✅ ${selectedDate} is now blocked for the whole day.`);
        } else if (start && end) {
            alert(`✅ Blocked ${selectedDate} from ${start} to ${end}.`);
        } else {
            alert("⚠️ Please select a valid time range or check 'Close Whole Day'.");
            return;
        }

        if (editModal) editModal.classList.remove("active");
        // Reset form
        if (startTimeInput) startTimeInput.value = "";
        if (endTimeInput) endTimeInput.value = "";
        if (fullDayCheckbox) fullDayCheckbox.checked = false;
    });
}

// Cancel modal (edit)
if (cancelBtn) {
    cancelBtn.addEventListener("click", () => {
        if (editModal) editModal.classList.remove("active");
        // Reset form
        if (startTimeInput) startTimeInput.value = "";
        if (endTimeInput) endTimeInput.value = "";
        if (fullDayCheckbox) fullDayCheckbox.checked = false;
    });
}

// --- Calendar Click Handling (Updated - Single Modal for View) ---
document.addEventListener("click", (event) => {
    // Find the closest .admin-calendar-box to handle clicks on inner elements (e.g., <small> in overviews)
    const box = event.target.closest('.admin-calendar-box');
    if (!box || !box.classList.contains('current-month')) {
        return; // Not a valid calendar day click
    }

    const year = currentDate ? currentDate.getFullYear() : new Date().getFullYear();
    const month = currentDate ? currentDate.getMonth() : new Date().getMonth();
    
    // Get day: Prioritize dataset.day (reliable), fallback to first part of innerHTML (before <br>)
    let day = parseInt(box.dataset.day);
    if (isNaN(day)) {
        // Simple fallback: Get text before first <br> (e.g., "9<br>..." → "9"), then parse
        const firstLine = box.innerHTML.split('<br')[0].trim();
        day = parseInt(firstLine);
    }
    
    if (isNaN(day)) {
        return; // Invalid day, ignore click
    }
    
    const dateKey = formatDate(year, month, day);
    currentDateKey = dateKey;  // Store for details

    if (adminMode === "view") {
        // VIEW MODE: Open view modal with clickable appointment list (Single Modal)
        const formattedDate = new Date(dateKey).toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });
        if (viewModalDate) viewModalDate.textContent = formattedDate;

        const appointments = patientAppointments[dateKey] || [];
        const listElement = viewList || appointmentList;
        if (listElement) {
            if (appointments.length === 0) {
                listElement.innerHTML = '<li class="no-appointments" style="text-align: center; color: gray; padding: 20px;">No appointments for this date.</li>';
            } else {
                listElement.innerHTML = appointments.map((a, index) => 
                    `<li class="appointment-item" data-appt-index="${index}" style="cursor: pointer; padding: 10px; border-bottom: 1px solid #ddd; transition: background 0.2s; list-style: none;">
                        👤 ${a.name} — ${a.time} (${a.service})
                    </li>`
                ).join('');
            }
        }

        // Reset to list view
        backToListView();
        if (viewModal) viewModal.classList.add("active");
    } else if (adminMode === "edit") {
        // EDIT MODE: Open block time modal
        if (editModalDate) editModalDate.textContent = dateKey;
        // Clear form
        if (startTimeInput) startTimeInput.value = "";
        if (endTimeInput) endTimeInput.value = "";
        if (fullDayCheckbox) fullDayCheckbox.checked = false;
        if (editModal) editModal.classList.add("active");
    }
});







// --- Event Delegation for Clickable Appointment Items in View List (Updated for Toggle) ---
document.addEventListener("click", (event) => {

    if (apptItem && viewModal && viewModal.classList.contains('active')) {
        const index = parseInt(apptItem.dataset.apptIndex);
        const appointments = patientAppointments[currentDateKey];
        if (appointments && appointments[index]) {
            showAppointmentDetails(appointments[index], currentDateKey);
        } else {
            console.warn('Invalid appointment index');
        }
    }
});

// Ensure starts in view mode with indicators
document.addEventListener("DOMContentLoaded", () => {
    if (typeof renderCalendar === 'function') {
        renderCalendar();
    }
});
</script>
